[package]
name = "p1-24531"
version = "0.1.0"
edition = "2024"


[profile.dev]
opt-level = 3
debug = false

[dependencies]
minifb = "0.28.0"
nalgebra-glm = "0.21.0"
font8x8 = "0.3.1"

image = { version = "=0.25.8", default-features = false, features = ["png"] }
rodio = { version = "0.22", default-features = false, features = ["playback", "vorbis"] }

# Confinamiento y recentrado del cursor. minifb ya depende de winapi
# 0.3.9 en Windows, así que esto no agrega crates nuevos al árbol.
[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3.9", features = ["windef", "winuser"] }
